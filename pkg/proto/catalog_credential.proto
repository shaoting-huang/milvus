syntax = "proto3";

package milvus.proto.catalog;

option go_package = "github.com/milvus-io/milvus/pkg/v3/proto/catalogpb";

import "common.proto";
import "internal.proto";
import "milvus.proto";
import "messages.proto";

// ---- Credential group ----
//
// IMetaTable credential surface. Read/write methods (InitCredential, GetCredential,
// ListCredentialUsernames) and the precondition checks (CheckIfAddCredential,
// CheckIfUpdateCredential, CheckIfDeleteCredential) carry the existing typed protos
// (internal.CredentialInfo / milvus.DeleteCredentialRequest) verbatim — no marshaled
// bytes. The two broadcast-driven mutations (AlterCredential, DeleteCredential) carry
// the streaming message Header/Body plus the control-channel time tick; the service
// rebuilds the BroadcastResult in memory (it never broadcasts) and calls the unchanged
// meta method. Every response's first field is a common.Status so merr error codes
// propagate (client reconstructs via merr.Error).

message InitCredentialRequest {}
message InitCredentialResponse {
  .milvus.proto.common.Status status = 1;
}

// AlterCredential [B]: rebuilt from AlterUserMessageV2 broadcast result.
message AlterCredentialRequest {
  .milvus.proto.messages.AlterUserMessageHeader header = 1;
  .milvus.proto.messages.AlterUserMessageBody body = 2;
  uint64 time_tick = 3;
}
message AlterCredentialResponse {
  .milvus.proto.common.Status status = 1;
}

// DeleteCredential [B]: rebuilt from DropUserMessageV2 broadcast result.
message DeleteCredentialRequest {
  .milvus.proto.messages.DropUserMessageHeader header = 1;
  uint64 time_tick = 2;
}
message DeleteCredentialResponse {
  .milvus.proto.common.Status status = 1;
}

message GetCredentialRequest {
  string username = 1;
}
message GetCredentialResponse {
  .milvus.proto.common.Status status = 1;
  .milvus.proto.internal.CredentialInfo credential = 2;
}

message ListCredentialUsernamesRequest {}
message ListCredentialUsernamesResponse {
  .milvus.proto.common.Status status = 1;
  repeated string usernames = 2;
}

message CheckIfAddCredentialRequest {
  .milvus.proto.internal.CredentialInfo cred_info = 1;
}
message CheckIfAddCredentialResponse {
  .milvus.proto.common.Status status = 1;
}

message CheckIfUpdateCredentialRequest {
  .milvus.proto.internal.CredentialInfo cred_info = 1;
}
message CheckIfUpdateCredentialResponse {
  .milvus.proto.common.Status status = 1;
}

message CheckIfDeleteCredentialRequest {
  .milvus.proto.milvus.DeleteCredentialRequest req = 1;
}
message CheckIfDeleteCredentialResponse {
  .milvus.proto.common.Status status = 1;
}
